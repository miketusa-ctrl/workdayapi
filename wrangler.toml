# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

name = "workdayapi-staging"
main = "src/index.js"
compatibility_date = "2024-09-23"
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 100

[observability]
enabled = false

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.txt"]
fallthrough = true

[vars]
PUBLIC_LAUNCH = "false"
ANON_LIMIT_PER_MIN = "30"
KEY_LIMIT_PER_MIN = "120"
FREE_CALLS_PER_MONTH = "1000"
PRO_CALLS_PER_MONTH = "50000"
DAILY_CALL_POOL = "15000"
DAILY_ANON_POOL = "8000"
DAILY_KEY_MINTS = "200"
DAILY_KEY_MINTS_PER_IP = "5"
DAILY_KEY_MINTS_PER_IPV6_48 = "15"
FREE_KEY_SIGNUP = "true"
AUTH_FAIL_LIMIT_PER_MIN = "10"
DAILY_AUTH_FAIL_POOL = "2000"
ADMIN_ENABLED = "true"
KEY_EPOCH = "2"
CACHE_SCOPE = "staging"
MCP_REGISTRY_AUTH = ""

[[unsafe.bindings]]
name = "CALC_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 30, period = 60 }

[[unsafe.bindings]]
name = "KEY_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 120, period = 60 }

[[unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "MINT_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "QUOTA"
class_name = "WorkdayQuota"

[[migrations]]
tag = "v1-workdayquota-sqlite"
new_sqlite_classes = ["WorkdayQuota"]

[env.production]
name = "workdayapi"
workers_dev = true
preview_urls = false

[env.production.limits]
cpu_ms = 100

[env.production.observability]
enabled = false

[env.production.vars]
PUBLIC_LAUNCH = "true"
ANON_LIMIT_PER_MIN = "30"
KEY_LIMIT_PER_MIN = "120"
FREE_CALLS_PER_MONTH = "1000"
PRO_CALLS_PER_MONTH = "50000"
DAILY_CALL_POOL = "15000"
DAILY_ANON_POOL = "8000"
DAILY_KEY_MINTS = "200"
DAILY_KEY_MINTS_PER_IP = "5"
DAILY_KEY_MINTS_PER_IPV6_48 = "15"
FREE_KEY_SIGNUP = "true"
AUTH_FAIL_LIMIT_PER_MIN = "10"
DAILY_AUTH_FAIL_POOL = "2000"
ADMIN_ENABLED = "false"
KEY_EPOCH = "1"
CACHE_SCOPE = "production"
MCP_REGISTRY_AUTH = ""

[[env.production.unsafe.bindings]]
name = "CALC_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_5>"
simple = { limit = 30, period = 60 }

[[env.production.unsafe.bindings]]
name = "KEY_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_6>"
simple = { limit = 120, period = 60 }

[[env.production.unsafe.bindings]]
name = "AUTH_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_7>"
simple = { limit = 10, period = 60 }

[[env.production.unsafe.bindings]]
name = "MINT_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_8>"
simple = { limit = 5, period = 60 }

[[env.production.durable_objects.bindings]]
name = "QUOTA"
class_name = "WorkdayQuota"

[[env.production.migrations]]
tag = "v1-workdayquota-sqlite"
new_sqlite_classes = ["WorkdayQuota"]
